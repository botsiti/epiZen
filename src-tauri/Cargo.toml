[package]
name = "epizen"
version = "0.1.0"
description = "A calm desktop app for a vault of plain Markdown notes"
edition = "2024"
publish = false

[lib]
name = "epizen_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# `tray-icon` for the menu bar item (src/tray.rs). Pinned to the minor: the item reaches the
# `tray-icon` crate under Tauri for its font and its panel's place, which a minor may change.
tauri = { version = "~2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8"
xattr = "1"
# Lookups for the library (src/net.rs): https only, to a fixed list of hosts. Pinned, with rustls
# and the system's certificate store, and no cookies, proxies' auth or anything else.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
# Already in the tree through Tauri; `time` paces MusicBrainz to one request a second.
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# Apple Calendar, through EventKit (src/eventkit.rs).
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "bitflags", "NSButton", "NSColor", "NSColorSpace", "NSControl", "NSFont", "NSFontDescriptor", "NSResponder", "NSScreen", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-event-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "EKCalendar", "EKCalendarItem", "EKEvent", "EKEventStore", "EKObject", "EKTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDate", "NSError", "NSGeometry", "NSPredicate", "NSString", "NSURL", "objc2-core-foundation"] }
tauri-plugin-wdio = { version = "=1.5.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# Test-only: lets WebdriverIO drive the app over a local WebDriver port.
# Built by `npm run build:e2e` in debug mode. Never part of a release build.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
